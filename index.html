<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clean Energy AR Explorer</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#667eea">


<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
max-width:600px;
padding:40px;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(30px);}
to{opacity:1; transform:translateY(0);}
}

h1{
font-size:36px;
margin-bottom:20px;
}

p{
opacity:.85;
margin-bottom:40px;
line-height:1.7;
font-size:18px;
}

.start-btn{
padding:18px 50px;
font-size:20px;
font-weight:bold;
border:none;
border-radius:40px;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
cursor:pointer;
transition:.3s;
box-shadow:0 10px 40px rgba(102,126,234,.5);
}

.start-btn:hover{
transform:translateY(-4px);
box-shadow:0 15px 50px rgba(102,126,234,.7);
}

.footer{
position:absolute;
bottom:25px;
font-size:14px;
opacity:.6;
}
</style>
</head>

<body>

<div class="container">
<h1>⚡ Welcome to Clean Energy AR Explorer</h1>

<p>
Discover how Solar and Wind energy can power everyday devices.
Scan interactive markers and explore renewable energy in Augmented Reality.
</p>

<button class="start-btn" onclick="startAR()">🚀 Start Experience</button>
</div>

<div class="footer">
© 2026 Clean Energy AR Project
</div>

<script>
function startAR(){
window.location.href = "ar.html";
}
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>


</body>
</html>
